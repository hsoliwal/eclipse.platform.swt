name: Maya native safety (portable)

on:
  pull_request:
    paths:
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaComposition.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT/common/org/eclipse/swt/internal/render/NativeDirtyRegions.java'
      - 'bundles/org.eclipse.swt/Eclipse SWT Custom Widgets/common/org/eclipse/swt/custom/LayeredViewport.java'
      - 'tests/org.eclipse.swt.tests.maya/JUnit Tests/org/eclipse/swt/tests/junit/maya/Test_org_eclipse_swt_maya_NativeLayers.java'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaCompositionChecks.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaCompositionDelta.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaDeviceHealth.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaDeviceHealthTest.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT Custom Widgets/common/org/eclipse/swt/custom/LayeredViewport.java'
      - 'tests/org.eclipse.swt.tests/JUnit Tests/org/eclipse/swt/tests/junit/Test_org_eclipse_swt_custom_LayeredViewport.java'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaNativeHandleRegistry.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaNativeHandleRegistryTest.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaCompositionChecksTest.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaCompositionDeltaTest.cc'
      - '.github/workflows/maya-native-safety.yml'
  push:
    branches: [ master ]
    paths:
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaComposition.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT/common/org/eclipse/swt/internal/render/NativeDirtyRegions.java'
      - 'bundles/org.eclipse.swt/Eclipse SWT Custom Widgets/common/org/eclipse/swt/custom/LayeredViewport.java'
      - 'tests/org.eclipse.swt.tests.maya/JUnit Tests/org/eclipse/swt/tests/junit/maya/Test_org_eclipse_swt_maya_NativeLayers.java'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaCompositionChecks.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaCompositionDelta.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaDeviceHealth.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaDeviceHealthTest.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT Custom Widgets/common/org/eclipse/swt/custom/LayeredViewport.java'
      - 'tests/org.eclipse.swt.tests/JUnit Tests/org/eclipse/swt/tests/junit/Test_org_eclipse_swt_custom_LayeredViewport.java'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaNativeHandleRegistry.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaNativeHandleRegistryTest.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaCompositionChecksTest.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaCompositionDeltaTest.cc'
      - '.github/workflows/maya-native-safety.yml'

jobs:
  portable-native-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: C++17 native checks with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          root='bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt'
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            "$root/tests/MayaCompositionChecksTest.cc" -o /tmp/maya-checks
          /tmp/maya-checks
      - name: C++17 retained composition delta differential tests
        shell: bash
        run: |
          set -euo pipefail
          root='bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt'
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            "$root/tests/MayaCompositionDeltaTest.cc" -o /tmp/maya-delta
          /tmp/maya-delta
      - name: Typed native handles, forced allocator ABA and 100000 retire cycles
        shell: bash
        run: |
          set -euo pipefail
          root='bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt'
          for compiler in g++ clang++; do
            "$compiler" -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              "$root/tests/MayaNativeHandleRegistryTest.cc" -o "/tmp/maya-token-${compiler}"
            ASAN_OPTIONS=detect_leaks=1 "/tmp/maya-token-${compiler}"
          done
      - name: Probe DirectComposition loss and reset policy with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          root='bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt'
          for compiler in g++ clang++; do
            "$compiler" -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
              -fsanitize=address,undefined -fno-omit-frame-pointer -I"$root" \
              "$root/tests/MayaDeviceHealthTest.cc" -o "/tmp/maya-health-${compiler}"
            ASAN_OPTIONS=detect_leaks=1 "/tmp/maya-health-${compiler}"
          done
      - name: Compile non-Windows JNI stub exports
        shell: bash
        run: |
          set -euo pipefail
          root='bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt'
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fPIC \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -shared "$root/MayaComposition.cc" -o /tmp/libmaya-composition-stubs.so

  windows-native-source:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile actual Win32 DirectComposition JNI owner with MSVC
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC installation not found' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          $source = 'bundles\org.eclipse.swt\Eclipse SWT Maya\native\cc\swt\MayaComposition.cc'
          $jni = Join-Path $env:JAVA_HOME 'include'
          $win = Join-Path $jni 'win32'
          $output = Join-Path $env:RUNNER_TEMP 'MayaComposition.obj'
          $command = 'call "' + $vcvars + '" && cl /nologo /std:c++17 /EHsc /W3 /WX /c "' + $source + '" /I"' + $jni + '" /I"' + $win + '" /Fo"' + $output + '"'
          & cmd.exe /D /S /C $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $output)) { throw 'MSVC reported success without output object' }
