name: Maya native safety (portable)

on:
  pull_request:
    paths:
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaComposition.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaCompositionChecks.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaCompositionDelta.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaCompositionScene.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaCompositionSceneTest.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/common/org/eclipse/swt/internal/maya/MayaComposition.java'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/maya.def'
      - 'tests/org.eclipse.swt.tests.maya/JUnit Tests/org/eclipse/swt/tests/junit/maya/Test_org_eclipse_swt_maya_Composition.java'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaCompositionChecksTest.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaCompositionDeltaTest.cc'
      - '.github/workflows/maya-native-safety.yml'
  push:
    branches: [ master ]
    paths:
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaComposition.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaCompositionChecks.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaCompositionDelta.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/MayaCompositionScene.h'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaCompositionSceneTest.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/common/org/eclipse/swt/internal/maya/MayaComposition.java'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/maya.def'
      - 'tests/org.eclipse.swt.tests.maya/JUnit Tests/org/eclipse/swt/tests/junit/maya/Test_org_eclipse_swt_maya_Composition.java'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaCompositionChecksTest.cc'
      - 'bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt/tests/MayaCompositionDeltaTest.cc'
      - '.github/workflows/maya-native-safety.yml'

jobs:
  portable-native-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: C++17 native checks with sanitizers
        shell: bash
        run: |
          set -euo pipefail
          root='bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt'
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            "$root/tests/MayaCompositionChecksTest.cc" -o /tmp/maya-checks
          /tmp/maya-checks
      - name: C++17 retained composition delta differential tests
        shell: bash
        run: |
          set -euo pipefail
          root='bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt'
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            "$root/tests/MayaCompositionDeltaTest.cc" -o /tmp/maya-delta
          /tmp/maya-delta
      - name: C++17 affine scene admission, legacy reset state and JNI bounds
        shell: bash
        run: |
          set -euo pipefail
          root='bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt'
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            "$root/tests/MayaCompositionSceneTest.cc" -o /tmp/maya-scene
          /tmp/maya-scene

      - name: Compile original MayaComposition.java and reconcile every JNI export
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/stub/org/eclipse/swt/internal/maya/impl" "$tmp/headers" "$tmp/classes"
          printf '%s\n' 'package org.eclipse.swt.internal.maya.impl;' \
            'public final class Library {' \
            '    private Library() {}' \
            '    public static void staticLoad() {}' \
            '}' > "$tmp/stub/org/eclipse/swt/internal/maya/impl/Library.java"
          source='bundles/org.eclipse.swt/Eclipse SWT Maya/common/org/eclipse/swt/internal/maya/MayaComposition.java'
          javac --release 21 -Xlint:all -Werror -h "$tmp/headers" -d "$tmp/classes" \
            "$source" "$tmp/stub/org/eclipse/swt/internal/maya/impl/Library.java"
          python3 - "$tmp/headers/org_eclipse_swt_internal_maya_MayaComposition.h" \
            'bundles/org.eclipse.swt/Eclipse SWT Maya/native/maya.def' <<'PY'
          import re
          import sys
          from pathlib import Path
          prefix = 'Java_org_eclipse_swt_internal_maya_MayaComposition__1'
          header = Path(sys.argv[1]).read_text()
          definition = Path(sys.argv[2]).read_text()
          generated = set(re.findall(r'Java_org_eclipse_swt_internal_maya_MayaComposition__1\w+', header))
          exported = set(re.findall(r'Java_org_eclipse_swt_internal_maya_MayaComposition__1\w+', definition))
          if not generated or generated != exported:
              raise SystemExit(f'JNI ABI mismatch: missing={generated - exported}, extra={exported - generated}')
          if prefix + 'nApplyScene' not in exported or prefix + 'nApplyPacked' not in exported or prefix + 'nUploadDirty' not in exported:
              raise SystemExit('JNI scene/packed/dirty ABI symbols missing')
          print('MayaComposition JNI declarations/export list: exact match', len(exported))
          PY

      - name: Compile non-Windows JNI stub exports
        shell: bash
        run: |
          set -euo pipefail
          root='bundles/org.eclipse.swt/Eclipse SWT Maya/native/cc/swt'
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -fPIC \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -shared "$root/MayaComposition.cc" -o /tmp/libmaya-composition-stubs.so
          nm -D --defined-only /tmp/libmaya-composition-stubs.so \
            | grep -Fq 'Java_org_eclipse_swt_internal_maya_MayaComposition__1nApplyScene'


  windows-native-source:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile actual Win32 DirectComposition JNI owner with MSVC
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC installation not found' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          $source = 'bundles\org.eclipse.swt\Eclipse SWT Maya\native\cc\swt\MayaComposition.cc'
          $jni = Join-Path $env:JAVA_HOME 'include'
          $win = Join-Path $jni 'win32'
          $output = Join-Path $env:RUNNER_TEMP 'MayaComposition.obj'
          $command = 'call "' + $vcvars + '" && cl /nologo /std:c++17 /EHsc /W3 /WX /c "' + $source + '" /I"' + $jni + '" /I"' + $win + '" /Fo"' + $output + '"'
          & cmd.exe /D /S /C $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $output)) { throw 'MSVC reported success without output object' }
