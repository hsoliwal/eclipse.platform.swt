name: SWT mobile Android native-host build
on:
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/m3-mobile-android-build.yml',
      'bundles/org.eclipse.swt/Eclipse SWT/common/org/eclipse/swt/internal/mobile/**']
  push:
    paths: ['mobile/android/**', '.github/workflows/m3-mobile-android-build.yml',
      'bundles/org.eclipse.swt/Eclipse SWT/common/org/eclipse/swt/internal/mobile/**']
permissions:
  contents: read
jobs:
  android-host-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble native Android Activity
        run: gradle --no-daemon -p mobile/android assembleDebug
