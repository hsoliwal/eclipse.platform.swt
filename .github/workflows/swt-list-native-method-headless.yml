# SPDX-License-Identifier: Apache-2.0 OR EPL-2.0
name: SWT Cocoa and GTK List method source contracts
on:
  pull_request:
    paths:
      - 'bundles/org.eclipse.swt/Eclipse SWT/cocoa/org/eclipse/swt/widgets/List.java'
      - 'bundles/org.eclipse.swt/Eclipse SWT/gtk/org/eclipse/swt/widgets/List.java'
      - 'tests/headless-native-list/**'
      - '.github/workflows/swt-list-native-method-headless.yml'
  push:
    branches: [master]
    paths:
      - 'bundles/org.eclipse.swt/Eclipse SWT/cocoa/org/eclipse/swt/widgets/List.java'
      - 'bundles/org.eclipse.swt/Eclipse SWT/gtk/org/eclipse/swt/widgets/List.java'
      - 'tests/headless-native-list/**'
      - '.github/workflows/swt-list-native-method-headless.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-method-source:
    if: github.repository == 'hsoliwal/eclipse.platform.swt'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        jdk: ['17', '21']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Compile and run the exact Cocoa and GTK original methods with strict Java 17 APIs
        run: python3 tests/headless-native-list/verify.py .
