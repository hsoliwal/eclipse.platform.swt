name: SWT mobile core Java 21 qualification
on:
  pull_request:
    paths: ['mobile/**', 'bundles/org.eclipse.swt/Eclipse SWT/common/org/eclipse/swt/internal/mobile/**', '.github/workflows/m3-mobile-core.yml']
  push:
    paths: ['mobile/**', 'bundles/org.eclipse.swt/Eclipse SWT/common/org/eclipse/swt/internal/mobile/**', '.github/workflows/m3-mobile-core.yml']
jobs:
  mobile-java-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Java mobile ownership/runtime regression
        run: bash mobile/test-core.sh
