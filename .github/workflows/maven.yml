# This is the main maven workflow for SWT.

# You can run this locally to test changes with the act command https://nektosact.com/
# For example, to run all GTK4 tests:
#   act -j build-linux --matrix java:21 --matrix gtk:gtk4 --artifact-server-path $PWD/.artifacts
# You may need to download runners on first run, act will ask but if you
# want the big runner there is no progress as it downloads, so you can pull it with
# docker directly:
#   docker pull catthehacker/ubuntu:full-latest

name: SWT Matrix Build
concurrency: 
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    # Documentation and M3 evidence records are not Maven inputs (no pom, bundle,
    # test or example reads .m3/ or docs/), so they do not need the six-leg build.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.m3/**'
  pull_request:
    branches: [ master ]
    types: [opened, reopened, synchronize, labeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.m3/**'

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes and upload events
    runs-on: ubuntu-slim
    outputs:
      # Lint warnings are expected in this block
      # https://github.com/dorny/paths-filter/issues/223#issuecomment-2463309889
      win32: ${{ steps.filter.outputs.win32  || 'false' }}
      gtk:   ${{ steps.filter.outputs.gtk    || 'false' }}
      cocoa: ${{ steps.filter.outputs.cocoa  || 'false' }}
      md:    ${{ steps.filter.outputs.md     || 'false' }}
      other: ${{ steps.filter.outputs.other  || 'false' }}
      mobile: ${{ steps.filter.outputs.mobile || 'false' }}
    steps:
      - name: Upload event file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'event-file'
          path: ${{ github.event_path }}
      - name: Paths filter (PRs only)
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            win32:
              - '**/win32/**'
            gtk:
              - '**/gtk/**'
            cocoa:
              - '**/cocoa/**'
            md:
              - '**/*.md'
            jenkins:
              - 'Jenkinsfile'
            mobile:
              - '{mobile/**,bundles/org.eclipse.swt/**/{mobile,android,ios,common}/**,tests/org.eclipse.swt.tests.mobile/**,.github/workflows/maven.yml}'
            # "other" = anything not matching the above buckets
            other:
              - '**'
              - '!**/win32/**'
              - '!**/gtk/**'
              - '!**/cocoa/**'
              - '!**/*.md'
              - '!Jenkinsfile'
              - '!mobile/**'
              - '!bundles/org.eclipse.swt/**/mobile/**'
              - '!bundles/org.eclipse.swt/**/android/**'
              - '!bundles/org.eclipse.swt/**/ios/**'
              - '!tests/org.eclipse.swt.tests.mobile/**'

  build-linux:
    name: Build (Linux)
    needs: changes
    # push => always; PR => run if gtk changed OR "other" changed (run-everything case)
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.gtk == 'true' || needs.changes.outputs.other == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
        gtk: [gtk3, gtk4]
        gdk_backend: [x11, wayland]
        exclude:
          - gtk: gtk3
            gdk_backend: wayland
    uses: ./.github/workflows/build.yml
    with:
      runner: ubuntu-latest
      java: ${{ matrix.java }}
      native: gtk.linux.x86_64
      gtk: ${{ matrix.gtk }}
      gdk_backend: ${{ matrix.gdk_backend }}
      # Parent API/Javadoc tooling requires Java 25; Java 21 legs build and execute tests.
      # All Linux jobs build the same Java sources, so check the API and javadoc only once
      api_check: ${{ matrix.java == '25' && matrix.gtk == 'gtk3' && matrix.gdk_backend == 'x11' }}
      performance: ${{ contains(github.event.pull_request.labels.*.name, 'performance') }}
      runtodotests: ${{ contains(github.event.pull_request.labels.*.name, 'runtodotests') }}

  mobile-java-android:
    name: Mobile owner contracts and Android Java
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
        with:
          lfs: false
      - name: Checkout unchanged Nebula contract subjects
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
        with:
          repository: hsoliwal/nebula
          ref: 91d01b4e3ff3ed0c298c4f5c148710b770756932
          path: .mobile-nebula
          lfs: false
      - uses: actions/setup-java@de5a937a1dc73fbc1a67d7d1aa4bebc1082f3190 # v5.0.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
          cache-dependency-path: mobile/pom.xml
      - uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f # v4.5
        with:
          maven-version: 3.9.11
      - name: Execute original-owner JUnit contracts
        run: mvn -B --no-transfer-progress -f mobile/pom.xml -Pcontracts -Dnebula.checkout="$GITHUB_WORKSPACE/.mobile-nebula" verify
      - name: Preserve executed Surefire reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-owner-surefire
          path: mobile/target/surefire-reports/
          if-no-files-found: error
          retention-days: 7
      - name: Select Android platform SDK
        run: sdkmanager 'platforms;android-35'
      - name: Compile Android binding with the actual SDK
        run: mvn -B --no-transfer-progress -f mobile/pom.xml -Dmobile.platform=android -Dandroid.sdk="$ANDROID_HOME" clean verify

  mobile-ios-compile:
    name: Mobile iOS UIKit compile
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
        with:
          lfs: false
      - uses: actions/setup-java@de5a937a1dc73fbc1a67d7d1aa4bebc1082f3190 # v5.0.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
          cache-dependency-path: mobile/pom.xml
      - uses: stCarolas/setup-maven@07fbbe97d97ef44336b7382563d66743297e442f # v4.5
        with:
          maven-version: 3.9.11
      - name: Compile original mobile owners and JNI declarations
        run: mvn -B --no-transfer-progress -f mobile/pom.xml -Dmobile.platform=ios verify
      - name: Compile UIKit backend and bootstrap against Xcode SDK
        run: bash mobile/ios/build.sh iphonesimulator arm64 "$GITHUB_WORKSPACE/mobile/target/swt-mobile-ios.jar"
      - name: Preserve native compile products
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-ios-compile
          path: |
            mobile/target/swt-mobile-ios.jar
            build/ios-iphonesimulator-arm64/jni-generated/
            build/ios-iphonesimulator-arm64/Release-iphonesimulator/*.a
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build (Windows)
    needs: changes
    # push => always; PR => run if win32 changed OR "other" changed (run-everything case)
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.win32 == 'true' || needs.changes.outputs.other == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    uses: ./.github/workflows/build.yml
    with:
      runner: windows-latest
      java: ${{ matrix.java }}
      native: win32.win32.x86_64
      api_check: ${{ matrix.java == '25' }}
      performance: ${{ contains(github.event.pull_request.labels.*.name, 'performance') }}
      runtodotests: ${{ contains(github.event.pull_request.labels.*.name, 'runtodotests') }}

  build-macos:
    name: Build (macOS)
    needs: changes
    # push => always; PR => run if cocoa changed OR "other" changed (run-everything case)
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.cocoa == 'true' || needs.changes.outputs.other == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/build.yml
    with:
      runner: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-latest' }}
      java: ${{ matrix.java }}
      native: cocoa.macosx.${{ matrix.arch }}
      # Both macOS fragments compile the same Java sources, so check the API and javadoc only once
      api_check: ${{ matrix.java == '25' && matrix.arch == 'aarch64' }}
      performance: ${{ contains(github.event.pull_request.labels.*.name, 'performance') }}
      runtodotests: ${{ contains(github.event.pull_request.labels.*.name, 'runtodotests') }}
