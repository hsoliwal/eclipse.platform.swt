name: Original SWT mobile Combo Java, Android and UIKit gates
on:
  pull_request:
    paths:
      - 'bundles/org.eclipse.swt/Eclipse SWT/mobile/**'
      - 'bundles/org.eclipse.swt/Eclipse SWT/android/**'
      - 'bundles/org.eclipse.swt/Eclipse SWT PI/ios/**'
      - 'tests/org.eclipse.swt.tests.mobile/**'
      - 'mobile/**'
      - '.github/workflows/m3-mobile-original-combo.yml'
  push:
    paths:
      - 'bundles/org.eclipse.swt/Eclipse SWT/mobile/**'
      - 'bundles/org.eclipse.swt/Eclipse SWT/android/**'
      - 'bundles/org.eclipse.swt/Eclipse SWT PI/ios/**'
      - 'tests/org.eclipse.swt.tests.mobile/**'
      - 'mobile/**'
      - '.github/workflows/m3-mobile-original-combo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  array-ops-java21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run deterministic randomized Combo array regression
        run: bash mobile/test-combo-array.sh
  original-combo-owner-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hsoliwal/nebula
          ref: 9244ce6e76bed2b6068fa44e6dab9b89c1bbbac9
          path: nebula
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute original SWT Combo/Text/List/Button and Nebula JUnit5 owner contracts
        run: mvn -B -ntp -f mobile/pom.xml -Pcontracts "-Dnebula.checkout=$GITHUB_WORKSPACE/nebula" clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-combo-owner-contracts
          path: mobile/target/surefire-reports/**
          if-no-files-found: warn
  android-native-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android SWT Combo and existing native owners
        run: mvn -B -ntp -f mobile/pom.xml -Dmobile.platform=android "-Dandroid.sdk=$ANDROID_SDK_ROOT" clean verify
  ios-uikit-source:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile iOS SWT original Combo Java source
        run: mvn -B -ntp -f mobile/pom.xml -Dmobile.platform=ios clean verify
      - name: Compile UIKit and generated native JNI owner
        run: bash mobile/ios/build.sh iphonesimulator arm64 "$GITHUB_WORKSPACE/mobile/target/swt-mobile-ios.jar"
