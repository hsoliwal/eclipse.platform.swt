---
type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.openrewrite.viewport.SwtPartVisibility
displayName: SWT part visibility events (brief rule 25)
description: >-
  Brief rule 25 (docs/m3/visibility/VISIBILITY_AND_VIEWPORT.md): SWT.PartVisible (57) and SWT.PartHidden (58), the typed
  PartVisibilityListener dispatch, and the hooks inside SWT that fire them: Control.setVisible and setParent (wrapped,
  so every return path reports), Control.setPartHidden, the Resize, Iconify and Deiconify events (the Widget.sendEvent
  funnel), and the win32 restore of a minimized shell (Decorations.WM_SIZE). Adding a PartVisible or PartHidden
  listener watches the control (Widget._addListener); disposing reports to PartVisibility.released. Applied to SWT.java,
  TypedListener.java and the Control, Widget (win32, gtk, cocoa) and win32 Decorations files. Idempotent.
recipeList:
  - org.openrewrite.text.FindAndReplace:
      find: "\tpublic static final int EmptinessChanged = 56;\n\n(?!\t/[*][*]\n\t [*] The SWT part visible event type)"
      replace: "\tpublic static final int EmptinessChanged = 56;\n\n\t/**\n\t * The SWT part visible event type (value is 57).\n\t * <p>\n\t * SWT sends it to a control that became part-visible: the control and all its ancestors visible with a non-zero\n\t * size, the shell visible and not minimized, no container marking it hidden (see\n\t * <code>Control.isPartVisible ()</code>). <code>detail</code> holds the cause, <code>item</code> the origin\n\t * (docs/m3/visibility/VISIBILITY_AND_VIEWPORT.md).\n\t * </p>\n\t *\n\t * @see org.eclipse.swt.events.PartVisibilityListener\n\t * @since 3.136\n\t */\n\tpublic static final int PartVisible = 57;\n\n\t/**\n\t * The SWT part hidden event type (value is 58): the control stopped being part-visible.\n\t *\n\t * @see #PartVisible\n\t * @since 3.136\n\t */\n\tpublic static final int PartHidden = 58;\n\n"
      regex: true
  - org.openrewrite.text.FindAndReplace:
      find: "(?<!partHidden [(]new PartVisibilityEvent [(]e[)][)];\n\t\t\tbreak;\n\t\t[}]\n)\t\tcase SWT[.]Verify: [{]\n"
      replace: "\t\tcase SWT.PartVisible: {\n\t\t\t((PartVisibilityListener) eventListener).partVisible (new PartVisibilityEvent (e));\n\t\t\tbreak;\n\t\t}\n\t\tcase SWT.PartHidden: {\n\t\t\t((PartVisibilityListener) eventListener).partHidden (new PartVisibilityEvent (e));\n\t\t\tbreak;\n\t\t}\n\t\tcase SWT.Verify: {\n"
      regex: true
  - org.openrewrite.text.FindAndReplace:
      find: "\tComposite parent;\n(?!\t/[*] part visibility)"
      replace: "\tComposite parent;\n\t/* part visibility (PartVisibility, docs/m3/visibility/VISIBILITY_AND_VIEWPORT.md): watched controls of the subtree, registry slot, last state told, container mark */\n\tint partCount, partIndex = -1;\n\tbyte partState;\n\tboolean partHidden;\n"
      regex: true
  - org.openrewrite.text.FindAndReplace:
      find: "public void setVisible [(]boolean visible[)] [{]\n\tcheckWidget ?[(][)];\n(?!\tsetVisibleInPart)"
      replace: "public void setVisible (boolean visible) {\n\tcheckWidget ();\n\tsetVisibleInPart (visible);\n\t//FLLDCIM: rule 25 - SWT itself reports the part visibility transition of the control and its watched subtree\n\tPartVisibility.changed (this, PartVisibilityEvent.VISIBILITY);\n}\n\n/* setVisible without the report (rule 25: the public method reports after every path of this one) */\nvoid setVisibleInPart (boolean visible) {\n"
      regex: true
  - org.openrewrite.text.FindAndReplace:
      find: "public boolean setParent [(]Composite parent[)] [{]\n\tcheckWidget ?[(][)];\n(?!\tComposite partOldParent)"
      replace: "public boolean setParent (Composite parent) {\n\tcheckWidget ();\n\tComposite partOldParent = this.parent;\n\t//FLLDCIM: rule 25 - the watched subtree moves its counts to the new ancestors; a new parent is a transition\n\tPartVisibility.detach (this);\n\ttry {\n\t\treturn setParentInPart (parent);\n\t} finally {\n\t\tPartVisibility.attach (this, partOldParent);\n\t}\n}\n\n/* setParent without the part visibility bookkeeping */\nboolean setParentInPart (Composite parent) {\n"
      regex: true
  - org.openrewrite.text.FindAndReplace:
      find: "\n@Override\nvoid releaseParent [(][)] [{]\n(?=(\tinvalidateVisibleRegion [(][)];\n)?\tparent[.]removeControl [(]this[)];)"
      replace: "\n/**\n * Adds the listener to the collection of listeners who will be notified when the receiver becomes part-visible or\n * part-hidden (see {@link #isPartVisible()}), by sending it one of the messages defined in the\n * <code>PartVisibilityListener</code> interface. SWT sends them itself, once per transition\n * (docs/m3/visibility/VISIBILITY_AND_VIEWPORT.md).\n *\n * @param listener the listener which should be notified\n *\n * @exception IllegalArgumentException <ul>\n *    <li>ERROR_NULL_ARGUMENT - if the listener is null</li>\n * </ul>\n * @exception SWTException <ul>\n *    <li>ERROR_WIDGET_DISPOSED - if the receiver has been disposed</li>\n *    <li>ERROR_THREAD_INVALID_ACCESS - if not called from the thread that created the receiver</li>\n * </ul>\n *\n * @see PartVisibilityListener\n * @see #removePartVisibilityListener\n * @since 3.136\n */\npublic void addPartVisibilityListener (PartVisibilityListener listener) {\n\taddTypedListener (listener, SWT.PartVisible, SWT.PartHidden);\n}\n\n/**\n * Removes the listener from the collection of listeners who will be notified when the receiver becomes\n * part-visible or part-hidden.\n *\n * @param listener the listener which should no longer be notified\n *\n * @exception IllegalArgumentException <ul>\n *    <li>ERROR_NULL_ARGUMENT - if the listener is null</li>\n * </ul>\n * @exception SWTException <ul>\n *    <li>ERROR_WIDGET_DISPOSED - if the receiver has been disposed</li>\n *    <li>ERROR_THREAD_INVALID_ACCESS - if not called from the thread that created the receiver</li>\n * </ul>\n *\n * @see PartVisibilityListener\n * @see #addPartVisibilityListener\n * @since 3.136\n */\npublic void removePartVisibilityListener (PartVisibilityListener listener) {\n\tcheckWidget ();\n\tif (listener == null) error (SWT.ERROR_NULL_ARGUMENT);\n\tremoveTypedListener (SWT.PartVisible, listener);\n\tremoveTypedListener (SWT.PartHidden, listener);\n}\n\n/**\n * Returns <code>true</code> if the receiver is part-visible: the receiver and all its ancestors up to its shell are\n * visible, have a width and height above zero and are not marked with {@link #setPartHidden(boolean)}, and the shell\n * is not minimized. Non-selected tab pages, non-top stack pages and the controls of collapsed expand items are hidden\n * by their containers, so they are not part-visible (docs/m3/visibility/VISIBILITY_AND_VIEWPORT.md).\n *\n * @return the receiver's part visibility state\n *\n * @exception SWTException <ul>\n *    <li>ERROR_WIDGET_DISPOSED - if the receiver has been disposed</li>\n *    <li>ERROR_THREAD_INVALID_ACCESS - if not called from the thread that created the receiver</li>\n * </ul>\n *\n * @see PartVisibilityListener\n * @since 3.136\n */\npublic boolean isPartVisible () {\n\tcheckWidget ();\n\treturn PartVisibility.visible (this);\n}\n\n/**\n * Marks the receiver hidden for part visibility, for a container that hides its content without\n * <code>setVisible</code> or a zero size (a drawn collapsible pane or stack, an overlay). Every listening control at\n * or under the receiver whose state changes is told.\n *\n * @param hidden <code>true</code> to mark the receiver hidden, <code>false</code> to clear the mark\n *\n * @exception SWTException <ul>\n *    <li>ERROR_WIDGET_DISPOSED - if the receiver has been disposed</li>\n *    <li>ERROR_THREAD_INVALID_ACCESS - if not called from the thread that created the receiver</li>\n * </ul>\n *\n * @see #isPartVisible()\n * @since 3.136\n */\npublic void setPartHidden (boolean hidden) {\n\tcheckWidget ();\n\tif (partHidden == hidden) return;\n\tpartHidden = hidden;\n\tPartVisibility.changed (this, PartVisibilityEvent.CONTAINER);\n}\n\n/**\n * Returns the mark set by {@link #setPartHidden(boolean)}.\n *\n * @return <code>true</code> when a container marked the receiver hidden\n *\n * @exception SWTException <ul>\n *    <li>ERROR_WIDGET_DISPOSED - if the receiver has been disposed</li>\n *    <li>ERROR_THREAD_INVALID_ACCESS - if not called from the thread that created the receiver</li>\n * </ul>\n *\n * @since 3.136\n */\npublic boolean getPartHidden () {\n\tcheckWidget ();\n\treturn partHidden;\n}\n\n@Override\nvoid releaseParent () {\n\tPartVisibility.released (this);\n"
      regex: true
  - org.openrewrite.text.FindAndReplace:
      find: "void _addListener (int eventType, Listener listener) {\n    if (eventTable == null) {\n        eventTable = new EventTable();\n    }\n\teventTable.hook (eventType, listener);\n}\n"
      replace: "void _addListener (int eventType, Listener listener) {\n    if (eventTable == null) {\n        eventTable = new EventTable();\n    }\n\teventTable.hook (eventType, listener);\n\tif ((eventType == SWT.PartVisible || eventType == SWT.PartHidden) && this instanceof Control control) {\n\t\t//FLLDCIM: rule 25 - a part visibility listener watches the control\n\t\tPartVisibility.watch (control);\n\t}\n}\n"
  - org.openrewrite.text.FindAndReplace:
      find: "void sendEvent [(]int eventType, Event event, boolean send[)] [{]\n(?!\tif [(]eventType == SWT[.]Resize)"
      replace: "void sendEvent (int eventType, Event event, boolean send) {\n\tif (eventType == SWT.Resize || eventType == SWT.Iconify || eventType == SWT.Deiconify) {\n\t\t//FLLDCIM: rule 25 - a size crossing zero or a shell minimized or restored is a part visibility transition\n\t\tPartVisibility.sent (this, eventType);\n\t}\n"
      regex: true
