type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.openrewrite.viewport.I31SwingTreeViewport
displayName: Initiative 31 (SWT on Swing) Tree mediates its items through the viewport
description: >-
  Catalogue VIEWPORT_WINDOWING. In the viewport mode (the default; -Dswt.widget.mode.Tree=original selects the
  original implementation) a Tree materializes items only when Swing or the API reads them, sends one model event
  per bulk change, and answers the top item from the viewport. Each hook is one delegation at the start of a
  method or after its argument checks; the logic lives in M3TreeViewport, M3TreeChildren and M3TreeTableRows.
recipeList:
  - com.synexia.openrewrite.viewport.I31SwingTreeViewportTree
  - com.synexia.openrewrite.viewport.I31SwingTreeViewportTreeItem
  - com.synexia.openrewrite.viewport.I31SwingTreeViewportSwing
  - com.synexia.openrewrite.viewport.I31SwingTreeViewportRows
  - com.synexia.openrewrite.viewport.I31SwingTreeViewportColumnWidth
---
