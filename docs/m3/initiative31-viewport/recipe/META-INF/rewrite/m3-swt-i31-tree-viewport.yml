type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.openrewrite.viewport.I31SwingTreeViewportSwing
displayName: Initiative 31 JTreeTable viewport hooks
description: >-
  The child-vector setter of the tree node and the tree-column width delegation of JTreeTable. The table-row
  bookkeeping of expansions is swapped at install time (M3TreeTableRows.install), because the listener that does
  it in the original mode is an anonymous class, which M3InsertStatements does not visit.
recipeList:
  - com.synexia.openrewrite.viewport.M3AddMemberIfMissing:
      declaringClasses: [org.eclipse.swt.internal.swing.DefaultMutableTreeTableNode]
      memberName: m3Children
      beforeMethod: setUserObjects
      memberSource: "  /**\n   * Replaces the child vector; the viewport mode of the SWT Tree supplies one that reads its children lazily.\n   */\n  public void m3Children(java.util.Vector<javax.swing.tree.TreeNode> children) {\n    this.children = children;\n  }"
  - com.synexia.openrewrite.viewport.M3InsertStatements:
      declaringClasses: [org.eclipse.swt.internal.swing.JTreeTable]
      methodName: getPreferredColumnWidth
      parameterCount: 1
      position: METHOD_START
      statements: "    int m3Width = columnIndex == 0? M3TreeTableRows.preferredWidth(this): -1;\n    if(m3Width >= 0) {\n      return m3Width;\n    }"
