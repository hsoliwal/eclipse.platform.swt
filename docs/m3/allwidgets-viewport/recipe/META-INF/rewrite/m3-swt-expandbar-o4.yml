type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.openrewrite.viewport.SwtExpandBarHoverO4
displayName: ExpandBar mouse tracking by binary search and the tracked hover item (optimization leaf O4)
description: >-
  Optimization pass leaf O4 (docs/m3/allwidgets-viewport/OPTIMIZATION_LEDGER.tsv). WM_MOUSEMOVE tested every item for
  hover, WM_LBUTTONDOWN and WM_MOUSELEAVE searched all items: O(n) per mouse message. Headers lie down the bar in index
  order (y strictly increasing, each header below the previous one), so the only item a point can hover is the last
  one starting above it (catalogue: binary search, upper bound); only one item is hovered at a time, so the bar tracks
  it and a move updates the old and the new one (a delta, not a rescan). O(log n). Viewport mode only; idempotent.
