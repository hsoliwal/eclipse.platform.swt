plugins { id 'com.android.application' }
android {
    namespace 'org.eclipse.swt.examples.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'org.eclipse.swt.examples.mobile'
        minSdk 35
        targetSdk 35
        versionCode 1
        versionName '0.1'
        testInstrumentationRunner 'org.eclipse.swt.examples.mobile.SWTMobileInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}
dependencies { implementation project(':swt') }
tasks.withType(JavaCompile).configureEach { options.compilerArgs.add('-XDstringConcat=inline') }
