#
# M3 fragment of org.eclipse.swt (leaf 18, M3_FRAGMENT v1): the Render M3 and GPU M3 trees in one fragment, the
# Skija jars nested under lib/ and listed one by one on Bundle-ClassPath (unversioned names: the Skija version lives
# only in the skija.version property of pom.xml). PDE/Tycho metadata; pom.xml stages lib/ before packaging.
###############################################################################
source.. = ../org.eclipse.swt/Eclipse SWT Render M3/win32/,\
           ../org.eclipse.swt/Eclipse SWT GPU M3/win32/
output.. = bin/
bin.includes = META-INF/,\
               .,\
               lib/skija-shared.jar,\
               lib/skija-windows-x64.jar,\
               lib/types.jar
jars.extra.classpath = lib/skija-shared.jar,\
                       lib/types.jar
