plugins { id 'com.android.application' version '8.7.2' }
android {
    namespace 'org.eclipse.swt.internal.mobile.android'
    compileSdk 35
    defaultConfig {
        applicationId 'org.eclipse.swt.internal.mobile.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.java.srcDirs += "$buildDir/generated/swt-mobile-core"
}
tasks.register('copyMobileCore', Copy) {
    from('../../bundles/org.eclipse.swt/Eclipse SWT/common') {
        include 'org/eclipse/swt/internal/mobile/MobileWidgetRuntime.java'
    }
    into "$buildDir/generated/swt-mobile-core"
}
tasks.named('preBuild').configure { dependsOn tasks.named('copyMobileCore') }
