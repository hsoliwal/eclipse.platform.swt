source..=JUnit Tests/
output.. = bin/
bin.includes = .,\
               META-INF/

# The following dependency prevents parallel execution of this and the referenced test-project. 
# Both use the same not-shareable resources and therefore cannot run in parallel. 
additional.bundles = org.eclipse.swt.tests

pom.model.packaging = eclipse-test-plugin
pom.model.property.testClass = org.eclipse.swt.tests.win32.AllWin32Tests

# The test JVM flags of tests/org.eclipse.swt.tests/pom.xml (whose win32 tests run here): JNI checks and SWT's strict
# checks (bug 532632). eclipse-platform-parent composes the tycho-surefire argLine as ${surefire.testArgLine}
# ${surefire.platformSystemProperties} ${surefire.systemProperties} ${surefire.moduleProperties}; surefire.testArgLine is
# the part a test plug-in defines, so --add-modules=ALL-SYSTEM stays.
pom.model.property.surefire.testArgLine = -Xcheck:jni -Dorg.eclipse.swt.internal.enableStrictChecks=true
